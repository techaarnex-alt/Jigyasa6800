<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jigyasa Group Of Companies business software">
  <title>Jigyasa Group Of Companies — Business Software</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#10231C; --pine:#16302B; --pine-2:#1F4438; --paper:#F5F6F0; --paper-2:#ECEEE4; --gold:#D9A404; --gold-deep:#A97800; --line:#DAD6C8; --muted:#5B6B62; --blue:#1F4E73; --blue-pale:#EAF1F7; --danger:#983F3F; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; color:var(--ink); background:var(--paper); font:15px/1.5 Inter,Arial,sans-serif; }
    button, input, textarea, select { font:inherit; }
    button, a { -webkit-tap-highlight-color:transparent; }
    button { cursor:pointer; }
    .shell { min-height:100vh; }
    .topbar { color:var(--paper); background:var(--pine); }
    .topbar-inner, .main, .login-wrap { max-width:1220px; margin:auto; padding-left:32px; padding-right:32px; }
    .topbar-inner { min-height:40px; display:flex; align-items:center; justify-content:space-between; gap:16px; font-size:12px; }
    .brandbar { background:var(--paper); border-bottom:1px solid var(--line); }
    .brandbar-inner { max-width:1220px; min-height:78px; margin:auto; padding:12px 32px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:flex; align-items:center; gap:10px; color:var(--pine); text-decoration:none; }
    .brand-logo { width:44px; height:44px; flex:none; object-fit:contain; }
    .login-brand .brand-logo { width:46px; height:46px; }
    .brand-name, h1, h2, h3 { font-family:Fraunces,Georgia,serif; font-weight:500; }
    .brand-name { font-size:19px; line-height:1.1; }
    .brand-tag { margin-top:2px; color:var(--muted); font-size:11px; }
    .user-box { display:flex; align-items:center; gap:11px; text-align:right; }
    .user-name { color:var(--pine); font-weight:700; font-size:13px; }
    .user-role { display:flex; align-items:center; justify-content:flex-end; gap:8px; color:var(--muted); font-size:12px; }
    .profile-logout { appearance:none; border:0; border-left:1px solid var(--line); background:transparent; color:var(--danger); padding:0 0 0 8px; font-size:11px; font-weight:700; }
    .profile-logout:hover { color:#6F2424; text-decoration:underline; }
    .avatar { width:35px; height:35px; display:grid; place-items:center; border:1px solid var(--gold); border-radius:50%; background:#FFF8DB; color:var(--pine); font-size:13px; font-weight:700; }
    .modulebar { display:flex; overflow:visible; background:var(--blue-pale); border-bottom:1px solid #C9D8E3; }
    .modulebar-inner { max-width:none; width:100%; margin:auto; display:flex; flex-wrap:nowrap; justify-content:center; padding:0; }
    .module-btn { appearance:none; border:0; border-right:1px solid #C9D8E3; background:transparent; color:var(--blue); padding:10px clamp(2px,.35vw,5px); font-size:clamp(8px,.78vw,11px); font-weight:700; white-space:nowrap; }
    .module-btn:hover { color:var(--pine); background:#DCE9F3; }
    .module-btn.active { color:var(--ink); background:var(--gold); box-shadow:inset 0 -3px 0 var(--gold-deep); }
    .module-btn.logout { color:var(--danger); }
    .module-menu { position:relative; }
    .module-menu > summary { list-style:none; }
    .module-menu > summary::-webkit-details-marker { display:none; }
    .module-menu-trigger::after { content:"▾"; margin-left:6px; font-size:10px; }
    .module-menu[open] .module-menu-trigger { color:var(--pine); background:#DCE9F3; }
    .module-menu[open] .module-menu-trigger.active { color:var(--ink); background:var(--gold); }
    .module-menu-list { position:absolute; top:100%; left:0; z-index:20; display:grid; min-width:190px; padding:6px; border:1px solid #B8CDDD; border-radius:0 0 5px 5px; background:#fff; box-shadow:0 10px 24px rgba(16,35,28,.14); }
    .module-menu-item { width:100%; border:0; border-radius:3px; background:transparent; color:var(--blue); padding:9px 10px; text-align:left; font-size:12px; font-weight:700; white-space:nowrap; }
    .module-menu-item:hover { background:var(--blue-pale); color:var(--pine); }
    .module-menu-item.active { background:var(--gold); color:var(--ink); box-shadow:inset 3px 0 0 var(--gold-deep); }
    .main { padding-top:30px; padding-bottom:50px; }
    .page-head { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:24px; }
    .eyebrow { margin-bottom:5px; color:var(--gold-deep); font-size:12px; font-weight:700; letter-spacing:.08em; }
    h1 { margin:0; color:var(--pine); font-size:clamp(1.75rem,3vw,2.45rem); line-height:1.1; }
    h2 { margin:0; color:var(--pine); font-size:1.45rem; line-height:1.2; }
    h3 { margin:0 0 5px; color:var(--pine); font-size:1.1rem; }
    .hint { max-width:650px; margin:8px 0 0; color:var(--muted); }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:40px; padding:9px 14px; border:1px solid transparent; border-radius:3px; text-decoration:none; font-size:13px; font-weight:700; transition:background .15s,transform .15s,box-shadow .15s; }
    .btn:hover { transform:translateY(-1px); }
    .btn-gold { background:var(--gold); color:var(--ink); box-shadow:0 1px 0 rgba(0,0,0,.1); }
    .btn-gold:hover { background:var(--gold-deep); box-shadow:0 5px 12px rgba(169,120,0,.22); }
    .btn-outline { border-color:var(--pine); background:transparent; color:var(--pine); }
    .btn-soft { border-color:#C9D8E3; background:var(--blue-pale); color:var(--blue); }
    .btn-danger { border-color:#DDBDBD; background:#FFF4F4; color:var(--danger); }
    .btn-small { min-height:32px; padding:6px 9px; font-size:12px; }
    .btn:disabled { opacity:.55; cursor:not-allowed; transform:none; }
    .dashboard-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:25px; }
    .metric, .panel, .form-panel { border:1px solid var(--line); background:#fff; border-radius:5px; box-shadow:0 1px 0 rgba(16,35,28,.03); }
    .metric { padding:18px; }
    .metric-label { color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
    .metric-number { margin-top:5px; color:var(--pine); font:600 28px/1 Fraunces,Georgia,serif; }
    .metric-note { margin-top:7px; color:var(--muted); font-size:12px; }
    .module-insight { margin:0 0 24px; }
    .module-insight .panel-head { align-items:flex-start; }
    .insight-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .insight-card { min-height:98px; padding:15px; border:1px solid var(--line); border-radius:4px; background:var(--paper); }
    .insight-label { color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
    .insight-value { margin-top:6px; color:var(--pine); font:600 24px/1 Fraunces,Georgia,serif; }
    .insight-note { margin-top:7px; color:var(--muted); font-size:11px; }
    .expense-cutout { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px; margin:0 0 20px; overflow:hidden; border:1px solid var(--line); border-radius:5px; background:var(--line); box-shadow:0 1px 0 rgba(16,35,28,.03); }
    .expense-total { min-height:128px; padding:22px; background:#fff; }
    .expense-total.project { background:linear-gradient(135deg,#16302B,#1F4438); color:var(--paper); }
    .expense-total .label { font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; }
    .expense-total:not(.project) .label { color:var(--muted); }
    .expense-total .amount { display:block; margin-top:11px; font:600 clamp(1.6rem,3vw,2.25rem)/1 Fraunces,Georgia,serif; }
    .expense-total .note { display:block; margin-top:8px; color:#C8D5CC; font-size:12px; }
    .expense-total:not(.project) .note { color:var(--muted); }
    .insight-list { display:grid; gap:0; }
    .insight-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; padding:10px 0; border-bottom:1px solid var(--paper-2); color:var(--muted); font-size:12px; }
    .insight-row:last-child { border-bottom:0; }
    .insight-row strong { color:var(--pine); font-size:13px; }
    .lock-note { display:inline-flex; align-items:center; margin-left:7px; padding:2px 6px; border-radius:999px; background:#F5EFFF; color:#604783; font-size:10px; font-weight:700; letter-spacing:.03em; vertical-align:middle; }
    .split { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(310px,.75fr); gap:20px; }
    .panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 20px; border-bottom:1px solid var(--line); }
    .panel-body { padding:18px 20px; }
    .activity { display:grid; gap:0; }
    .activity-row { display:grid; grid-template-columns:10px minmax(0,1fr) auto; align-items:start; gap:10px; padding:12px 0; border-bottom:1px solid var(--paper-2); }
    .activity-row:last-child { border-bottom:0; }
    .dot { width:9px; height:9px; margin-top:7px; border-radius:50%; background:var(--gold); }
    .activity-title { color:var(--pine); font-weight:700; font-size:13px; }
    .activity-meta { color:var(--muted); font-size:12px; }
    .status { display:inline-flex; align-items:center; gap:5px; width:max-content; max-width:100%; padding:3px 7px; border-radius:999px; background:#EEF4F0; color:#33634C; font-size:11px; font-weight:700; white-space:nowrap; }
    .status.warn { background:#FFF8DE; color:#8A6500; }
    .status.draft { background:var(--blue-pale); color:var(--blue); }
    .status.keep { background:#F5EFFF; color:#604783; }
    .shell:has(.dashboard-view) { height:100dvh; overflow:hidden; }
    .main:has(.dashboard-view) { height:calc(100dvh - 154px); min-height:0; overflow:hidden; padding-top:16px; padding-bottom:16px; }
    .dashboard-view { height:100%; display:grid; grid-template-rows:auto auto minmax(0,1fr); gap:12px; }
    .dashboard-summary { grid-template-rows:auto auto minmax(0,1fr); }
    .dashboard-quote { position:relative; display:grid; place-items:center; min-height:0; overflow:hidden; padding:clamp(28px,6vh,64px) clamp(24px,8vw,120px); border:1px solid rgba(217,164,4,.45); border-radius:6px; background:radial-gradient(520px 260px at 50% 0,rgba(217,164,4,.18),transparent 68%),linear-gradient(135deg,#16302B,#1F4438); color:var(--paper); text-align:center; box-shadow:0 12px 28px rgba(16,35,28,.12); }
    .dashboard-quote::before { content:"“"; position:absolute; top:-34px; left:30px; color:rgba(217,164,4,.2); font:200px/1 Fraunces,Georgia,serif; }
    .dashboard-quote-content { position:relative; max-width:760px; }
    .dashboard-quote .eyebrow { margin-bottom:16px; color:#EBC750; }
    .dashboard-quote blockquote { margin:0; font:500 clamp(1.45rem,2.7vw,2.25rem)/1.25 Fraunces,Georgia,serif; }
    .dashboard-quote p { margin:15px 0 0; color:#D7DED8; font-size:13px; }
    .dashboard-view .page-head, .dashboard-view .dashboard-grid { margin:0; }
    .dashboard-view .metric { padding:13px 14px; }
    .dashboard-view .metric-number { font-size:25px; }
    .dashboard-view .metric-note { margin-top:5px; }
    .dashboard-panels { height:100%; min-height:0; grid-template-columns:minmax(0,1.15fr) minmax(430px,.85fr); gap:14px; }
    .dashboard-panels .panel { display:flex; flex-direction:column; min-height:0; }
    .dashboard-panels .panel-head { flex:none; padding:12px 16px; }
    .dashboard-panels .panel-head h2 { font-size:1.2rem; }
    .dashboard-panels .panel-body { flex:1; min-height:0; overflow:auto; padding:10px 16px; scrollbar-width:thin; }
    .dashboard-panels .activity-row { gap:8px; padding:8px 0; }
    .dashboard-panels .dot { width:8px; height:8px; margin-top:5px; }
    .dashboard-panels .activity-title { font-size:12px; }
    .dashboard-panels .activity-meta { font-size:11px; }
    .dashboard-section-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }
    .dashboard-section { display:flex; align-items:center; justify-content:space-between; gap:6px; min-height:38px; padding:7px 8px; border:1px solid var(--line); border-radius:3px; background:var(--paper); color:var(--pine); text-align:left; font-size:11px; font-weight:700; line-height:1.2; }
    .dashboard-section:hover { border-color:var(--gold); background:#FFF9E6; }
    .dashboard-section b { flex:none; min-width:18px; color:var(--blue); text-align:center; font-size:11px; }
    .action-row { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
    .workspace { display:grid; grid-template-columns:minmax(0,1fr) 370px; gap:20px; align-items:start; }
    .records-top { display:flex; align-items:center; justify-content:space-between; gap:15px; padding:18px 20px; border-bottom:1px solid var(--line); }
    .search { width:min(100%,270px); border:1px solid var(--line); border-radius:3px; padding:9px 11px; background:var(--paper); color:var(--ink); }
    .search:focus, input:focus, select:focus, textarea:focus { outline:3px solid rgba(217,164,4,.22); border-color:var(--gold-deep); }
    .record-list { padding:0 20px; }
    .record-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:15px; padding:15px 0; border-bottom:1px solid var(--paper-2); }
    .record-row:last-child { border-bottom:0; }
    .record-title { margin:0 0 3px; color:var(--pine); font-size:14px; font-weight:700; }
    .record-info { color:var(--muted); font-size:12px; }
    .record-actions { display:flex; align-items:flex-start; gap:7px; }
    .record-actions .btn, .plot-item-actions .btn, .table-actions .btn { width:96px; justify-content:center; }
    .record-id { color:var(--muted); font:11px ui-monospace,SFMono-Regular,Consolas,monospace; }
    .form-panel { overflow:hidden; }
    .form-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:18px 20px; color:var(--paper); background:var(--pine); }
    .form-head h2 { color:var(--paper); font-size:1.32rem; }
    .form-head p { margin:5px 0 0; color:#D7DED8; font-size:12px; }
    .form-head .btn { flex:none; }
    .form-quick-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--paper-2); }
    .form-quick-actions .btn { width:100%; }
    .form-body { padding:20px; }
    .field { display:grid; gap:5px; margin-bottom:14px; }
    .field label { color:var(--pine); font-size:12px; font-weight:700; }
    .field input, .field select, .field textarea { width:100%; border:1px solid var(--line); border-radius:3px; padding:9px 10px; background:#fff; color:var(--ink); }
    .field textarea { min-height:90px; resize:vertical; }
    .buyer-form-section { margin:0 0 16px; padding:16px; border:1px solid var(--line); border-radius:4px; background:var(--paper-2); }
    .buyer-form-section legend { padding:0 6px; color:var(--pine); font-size:12px; font-weight:800; letter-spacing:.03em; }
    .buyer-form-section .section-hint { margin:0 0 14px; color:var(--muted); font-size:12px; line-height:1.45; }
    .buyer-field-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 12px; }
    .buyer-field-grid .field { min-width:0; }
    .password-field { position:relative; }
    .password-field input { padding-right:46px; }
    .password-toggle { position:absolute; right:7px; top:50%; transform:translateY(-50%); border:0; border-radius:3px; padding:5px 7px; background:transparent; color:var(--pine); font:600 12px Inter,Arial,sans-serif; cursor:pointer; }
    .password-toggle:hover, .password-toggle:focus-visible { background:var(--blue-pale); outline:2px solid var(--gold); outline-offset:1px; }
    .field-help { color:var(--muted); font-size:11px; }
    .form-actions { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:18px; }
    .form-actions .btn:first-child { grid-column:1 / -1; }
    .registration-page { max-width:1160px; margin:0 auto; }
    .registration-banner { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:20px; }
    .registration-banner p { margin:7px 0 0; color:var(--muted); }
    .registration-date { min-width:180px; padding:10px 12px; border:1px solid #C9D8E3; border-radius:4px; background:var(--blue-pale); color:var(--blue); font-size:12px; font-weight:700; }
    .registration-date span { display:block; margin-top:2px; color:var(--pine); font-size:15px; }
    .registration-form { border:1px solid var(--line); border-radius:6px; overflow:hidden; background:#fff; box-shadow:0 5px 18px rgba(16,35,28,.08); }
    .registration-form-head { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:18px 22px; color:var(--paper); background:var(--pine); }
    .registration-form-head h2 { color:var(--paper); font-size:1.45rem; }
    .registration-form-head p { margin:4px 0 0; color:#D7DED8; font-size:12px; }
    .registration-form-body { display:grid; grid-template-columns:1fr 1fr; gap:0; }
    .registration-section { padding:22px; }
    .registration-section + .registration-section { border-left:1px solid var(--line); }
    .registration-section h3 { margin:0 0 17px; padding-bottom:8px; border-bottom:2px solid var(--blue); color:var(--blue); font:600 15px Inter,Arial,sans-serif; }
    .registration-fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px 14px; }
    .registration-field { display:grid; gap:5px; color:var(--pine); font-size:12px; font-weight:700; }
    .registration-field.full { grid-column:1 / -1; }
    .registration-field input, .registration-field select, .registration-field textarea { width:100%; min-height:38px; border:1px solid var(--line); border-radius:3px; padding:8px 9px; background:#fff; color:var(--ink); font:14px Inter,Arial,sans-serif; font-weight:400; }
    .registration-field textarea { min-height:72px; resize:vertical; }
    .registration-choice { display:flex; align-items:center; flex-wrap:wrap; gap:8px 14px; min-height:38px; color:var(--ink); font-size:13px; font-weight:500; }
    .registration-choice input { width:auto; min-height:0; margin:0 3px 0 0; accent-color:var(--blue); }
    .registration-choice label { display:inline-flex; align-items:center; white-space:nowrap; }
    .registration-checks { display:grid; gap:6px; padding:10px; border:1px solid var(--paper-2); border-radius:3px; background:var(--paper); }
    .registration-checks label { display:flex; align-items:center; gap:7px; color:var(--ink); font-size:12px; font-weight:500; }
    .registration-checks input { width:auto; min-height:0; margin:0; accent-color:var(--gold-deep); }
    .registration-submit { display:flex; align-items:center; justify-content:flex-end; gap:10px; padding:18px 22px; border-top:1px solid var(--line); background:var(--paper); }
    .registration-submit .btn { min-width:180px; }
    .registration-history { margin-top:22px; }
    .registration-history .panel-body { padding:0 20px; }
    .registration-plot-status { grid-column:1 / -1; padding:10px; border:1px solid var(--paper-2); border-radius:3px; background:var(--paper); }
    .registration-plot-status strong { display:block; margin-bottom:8px; color:var(--pine); font-size:12px; }
    .registration-plot-grid { display:flex; flex-wrap:wrap; gap:7px; }
    .registration-plot { min-width:64px; padding:7px 9px; border:1px solid transparent; border-radius:3px; font:700 12px Inter,Arial,sans-serif; cursor:pointer; }
    .registration-plot.available { background:#DDF3E4; border-color:#51A66A; color:#146B35; }
    .registration-plot.available.selected { outline:2px solid var(--blue); outline-offset:1px; }
    .registration-plot.booked, .registration-plot.sold, .registration-plot.cancelled { background:#FBE1E1; border-color:#D56A6A; color:#A02727; cursor:not-allowed; }
    .registration-plot.hold { background:#FFF0C9; border-color:#D99A17; color:#805500; cursor:not-allowed; }
    .registration-plot.free { background:#E5EDF2; border-color:#8CA2B2; color:#425565; }
    .registration-inventory-note { margin:0; color:var(--muted); font-size:12px; }
    .plot-tabs { display:flex; flex-wrap:wrap; gap:7px; margin:0 0 20px; padding:10px; border:1px solid #C9D8E3; border-radius:5px; background:var(--blue-pale); }
    .plot-tab { min-height:32px; padding:6px 10px; border:1px solid transparent; border-radius:3px; background:transparent; color:var(--blue); font-size:12px; font-weight:700; }
    .plot-tab:hover, .plot-tab.active { border-color:#B8CDDD; background:#fff; color:var(--pine); }
    .plot-tab.status-tab { color:#53645B; }
    .plot-tab.status-tab.active { color:var(--pine); }
    .plot-overview { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr); gap:20px; }
    .plot-overview-copy { padding:24px; border:1px solid var(--line); border-radius:5px; background:linear-gradient(135deg,#fff 0%,#F7F9F5 100%); }
    .plot-overview-copy h2 { font-size:1.7rem; }
    .plot-overview-copy p { max-width:56ch; margin:10px 0 18px; color:var(--muted); }
    .plot-action-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .plot-action { display:grid; gap:3px; min-height:86px; padding:14px; border:1px solid var(--line); border-radius:4px; background:#fff; color:var(--pine); text-align:left; }
    .plot-action:hover { border-color:var(--gold); box-shadow:0 5px 14px rgba(16,35,28,.07); }

rue, attrs:" data-plot-calculation=\"companyValue\"" })}${plotField("Partner commission", "partnerCommission", displayMoney(financial.partnerCommission), { readonly:true, attrs:" data-plot-calculation=\"partnerCommission\"" })}${plotField("Net company margin", "netMargin", displayMoney(financial.netMargin), { readonly:true, attrs:" data-plot-calculation=\"netMargin\"" })}</div></div>${plotField("Remark", "notes", data.notes, { type:"textarea", full:true, placeholder:"Optional plot note" })}</div></div><div class="plot-form-actions">${editing ? `<button class="btn btn-danger" type="button" data-action="delete-plot-entity">Delete plot</button>` : ""}<button class="btn btn-outline" type="button" data-action="plot-reset">Reset</button><button class="btn btn-gold" type="submit" ${hasSetup ? "" : "disabled"}>${editing ? "Update plot" : single ? "Create plot" : "Submit plot"}</button></div></form><aside class="plot-aside"><h3>Plot pricing</h3><p>${hasSetup ? "Area, selling value, PLC, company cost, partner commission, and net company margin recalculate automatically while you fill the form." : "Create at least one project and block before saving a plot."}</p><ul><li>Rate and company rate are saved per sq ft.</li><li>PLC and partner commission are percentages of the basic/selling price.</li><li>Buyer and payment details remain with every booked or sold plot.</li></ul></aside></section>`;

    function expandPlotNumbers(seed, count) {
      if (count <= 1) return [seed];
      const match = String(seed).trim().match(/^(.*?)(\d+)$/);
      if (!match) return Array.from({ length:count }, (_, index) => index ? `${seed}-${index + 1}` : seed);
      const prefix = match[1], first = Number(match[2]), width = match[2].length;
      return Array.from({ length:count }, (_, index) => `${prefix}${String(first + index).padStart(width, "0")}`);
    }

    async function saveRecord(kept) {
      const form = document.getElementById("recordForm");
      if (!form.reportValidity()) return;
      const raw = Object.fromEntries(new FormData(form));
      const module = modules.find(item => item.id === raw.module);
      const existing = state.records.find(record => record.id === raw.id);
      if (module?.id === "buyers") raw.notes = `${buyerDetailsPrefix}${JSON.stringify({ email:raw.buyerEmail || "", source:raw.buyerSource || "", requirements:raw.notes || "" })}`;
      const status = module?.id === "buyers" ? "Buyer" : raw.status;
      const result = await api("/api/records", { method:"POST", body:JSON.stringify({ ...raw, status, kept: kept || existing?.kept || false, locked: module?.locked || existing?.locked || false }) });
      const index = state.records.findIndex(record => record.id === result.record.id);
      if (index >= 0) state.records[index] = result.record;
      else state.records.unshift(result.record);
      state.selectedId = result.record.id;
      state.search = "";
      renderApp();
      showNotice(kept ? "Record kept and saved." : "Record saved successfully.");

      if (formId === "employeeLedgerForm") {
        event.preventDefault();
        try { await saveEmployeeLedger(); } catch (error) { showNotice(error.message, "error"); }
      }
      if (formId === "adminToolForm") {
        event.preventDefault();
        try { await saveAdminTool(); } catch (error) { showNotice(error.message, "error"); }
      }
      if (formId === "userAccessForm") {
        event.preventDefault();
        try { await saveUserAccount(); } catch (error) { showNotice(error.message, "error"); }
      }
      if (formId === "investorForm") {
        event.preventDefault();
        try { await saveInvestor(); } catch (error) { showNotice(error.message, "error"); }
      }
      if (formId === "registrationBookingForm") {
        event.preventDefault();
        const pdfWindow = window.open("", "_blank", "width=860,height=760");
        try { await saveRegistrationBooking(pdfWindow); } catch (error) { pdfWindow?.close(); showNotice(error.message, "error"); }
      }
      if (formId === "plotProjectForm") {
        event.preventDefault();
        try { await savePlotProject(); } catch (error) { showNotice(error.message, "error"); }
      }
      if (formId === "plotBlockForm") {
        event.preventDefault();
        try { await savePlotBlock(); } catch (error) { showNotice(error.message, "error"); }
      }
      if (formId === "plotForm") {
        event.preventDefault();
        try { await savePlots(); } catch (error) { showNotice(error.message, "error"); }
      }
      if (formId === "partnerForm") {
        event.preventDefault();
        try { await savePartner(); } catch (error) { showNotice(error.message, "error"); }
      }
      if (formId === "passwordForm") {
        event.preventDefault();
        try {
          const result = await api("/api/password", { method:"POST", body:JSON.stringify(Object.fromEntries(new FormData(event.target))) });
          if (result.ok) { event.target.reset(); showNotice("Password changed successfully."); }
        } catch (error) { showNotice(error.message, "error"); }
      }
    });
    // Keep the module bar compact: only the section the user opens may show its options.
    document.addEventListener("toggle", event => {
      const openedMenu = event.target;
      if (!openedMenu.matches(".module-menu") || !openedMenu.open) return;
      document.querySelectorAll(".module-menu[open]").forEach(menu => {
        if (menu !== openedMenu) menu.open = false;
      });
    }, true);

    document.addEventListener("pointerdown", event => {
      if (event.target.closest(".module-menu")) return;
      document.querySelectorAll(".module-menu[open]").forEach(menu => { menu.open = false; });
    });

    document.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;
      document.querySelectorAll(".module-menu[open]").forEach(menu => { menu.open = false; });
    });

    document.addEventListener("click", async event => {
      const action = event.target.closest("[data-action]");
      const plotButton = event.target.closest("[data-registration-plot]");
      if (plotButton && !plotButton.disabled) {
        const form = document.getElementById("registrationBookingForm");
        if (form) {
          form.querySelector('[name="plotNumber"]').value = plotButton.dataset.registrationPlot;
          form.querySelectorAll("[data-registration-plot]").forEach(button => button.classList.toggle("selected", button === plotButton));
        }
        return;
      }
      if (!action) return;
      const type = action.dataset.action;
      try {
        if (type === "toggle-password") {
          const input = action.parentElement.querySelector("input");
          const showPassword = input.type === "password";
          input.type = showPassword ? "text" : "password";
          action.setAttribute("aria-label", showPassword ? "Hide password" : "Show password");
          action.setAttribute("aria-pressed", String(showPassword));
        }
        if (type === "switch") navigateTo(action.dataset.module);
        if (type === "payout-mode") { state.partnerPayoutMode = action.dataset.mode === "manual" ? "manual" : "normal"; renderApp(); setTimeout(updatePartnerPayout, 0); }
        if (type === "edit") { state.selectedId = action.dataset.id; renderApp(); document.getElementById("title")?.focus(); }
        if (type === "edit-registration") { state.selectedId = action.dataset.id; renderApp(); document.getElementById("registration-name")?.focus(); }
        if (type === "allotment-letter") downloadAllotmentLetter(action.dataset.id);
        if (type === "registration-pdf") downloadRegistrationPdf(action.dataset.id);
        if (type === "payment-receipt") downloadPaymentReceipt(action.dataset.id);
        if (type === "payment-noc") downloadPaymentNoc(action.dataset.id);
        if (type === "partner-transaction-pdf") downloadPartnerTransactionPdf(action.dataset.id);
        if (type === "kisan-pdf") downloadKisanPdf(action.dataset.id);
        if (type === "new-record") { state.selectedId = ""; state.search = ""; renderApp(); document.getElementById("title")?.focus(); }
        if (type === "new-registration") { state.selectedId = ""; state.search = ""; renderApp(); document.getElementById("registration-name")?.focus(); }
        if (type === "daybook-view") { state.daybookView = action.dataset.view || "today-entry"; state.selectedId = ""; state.daybookEntryAdd = false; state.lekhPatrAdd = false; renderApp(); }
        if (type === "daybook-edit") { state.selectedId = action.dataset.id; state.daybookView = "today-entry"; state.daybookEntryAdd = true; state.daybookEntryCategory = ""; renderApp(); }
        if (type === "daybook-reset") { state.selectedId = ""; renderApp(); }
        if (type === "expense-edit") { state.selectedId = action.dataset.id; renderApp(); }
        if (type === "expense-reset") { state.selectedId = ""; renderApp(); }
        if (type === "daybook-new-entry") { state.selectedId = ""; state.daybookEntryAdd = true; state.daybookEntryCategory = action.dataset.category || "Today Entry"; renderApp(); }
        if (type === "daybook-filter-reset") { state.daybookFilter = { from:"", to:"", query:"", searchType:"All", partner:"All", project:"All" }; renderApp(); }
        if (type === "daybook-filter-all") { state.daybookFilter = { from:"", to:"", query:"", searchType:"All", partner:"All", project:"All" }; renderApp(); }
        if (type === "daybook-print") window.print();
        if (type === "lekh-new") { state.selectedId = ""; state.lekhPatrAdd = true; renderApp(); }
        if (type === "lekh-edit") { state.selectedId = action.dataset.id; state.lekhPatrAdd = true; renderApp(); }
        if (type === "lekh-cancel") { state.selectedId = ""; state.lekhPatrAdd = false; renderApp(); }
        if (type === "lekh-delete") await deleteRecord(action.dataset.id);
        if (type === "lekh-print") window.print();
        if (type === "lekh-download") downloadLekhPatr(action.dataset.id);
        if (type === "lekh-details") { const data = daybookData(state.records.find(record => record.id === action.dataset.id)); showNotice(`${data.plotNumber || "Lekh-Patr"}: ${data.description || "No additional details."}`); }
        if (type === "kisan-view") { state.kisanView = action.dataset.view || "add-kisan"; state.selectedId = ""; renderApp(); }
        if (type === "kisan-edit") { state.selectedId = action.dataset.id; state.kisanView = action.dataset.view; renderApp(); }
        if (type === "kisan-reset") { state.selectedId = ""; renderApp(); }
        if (type === "hr-view") { state.hrView = action.dataset.view || "hr-profile"; state.selectedId = ""; renderApp(); }
        if (type === "hr-edit") { state.selectedId = action.dataset.id; state.hrView = "add-employee"; renderApp(); }
        if (type === "hr-reset") { state.selectedId = ""; renderApp(); }
        if (type === "attendance-locate") await markAttendanceFromLocation();
        if (type === "admin-tool") { state.adminTool = action.dataset.tool || ""; renderApp(); }
        if (type === "admin-home") { state.adminTool = ""; renderApp(); }
        if (type === "report-tool") { state.reportTool = action.dataset.tool || ""; renderApp(); }
        if (type === "report-home") { state.reportTool = ""; renderApp(); }
        if (type === "print-project-block-income") printProjectBlockIncomeReport();
        if (type === "investor-view") { state.investorView = action.dataset.view || "investor-profile"; state.selectedId = ""; renderApp(); }
        if (type === "investor-edit") { state.selectedId = action.dataset.id; state.investorView = "investor-profile"; renderApp(); }
        if (type === "investor-reset") { state.selectedId = ""; renderApp(); }
        if (type === "keep") await toggleKeep(action.dataset.id);
        if (type === "keep-form") await saveRecord(true);
        if (type === "delete-form") await deleteRecord(state.selectedId);
        if (type === "plot-view") { state.plotView = action.dataset.view || "overview"; state.selectedId = ""; state.search = ""; state.plotSearch = action.dataset.search || ""; state.plotContext = { project:action.dataset.project || "", block:action.dataset.block || "" }; state.partnerFilter = { searchType:"All", query:"", partner:"", from:"", to:"" }; renderApp(); }
        if (type === "plot-edit") { const record = state.records.find(item => item.id === action.dataset.id); const data = plotData(record); state.selectedId = action.dataset.id; state.plotContext = { project:data.project || data.name || "", block:data.block || "" }; state.plotView = action.dataset.entity === "project" ? "add-project" : action.dataset.entity === "block" ? "add-block" : "add-plot"; renderApp(); }
        if (type === "plot-reset") { state.selectedId = ""; state.plotContext = { project:"", block:"" }; renderApp(); }
        if (type === "plot-list-search") renderApp();
        if (type === "plot-list-reset") { state.plotSearch = ""; renderApp(); }
        if (type === "partner-view") { state.partnerView = action.dataset.view || "overview"; state.selectedId = ""; state.partnerFilter = { searchType:"All", query:"", partner:action.dataset.partner || "", from:"", to:"" }; renderApp(); }
        if (type === "partner-edit") { state.selectedId = action.dataset.id; state.partnerView = "add-partner"; renderApp(); }
        if (type === "partner-reset") { state.selectedId = ""; renderApp(); }
        if (type === "partner-filter-apply") renderApp();
        if (type === "partner-filter-reset") { state.partnerFilter = { searchType:"All", query:"", partner:"", from:"", to:"" }; renderApp(); }
        if (type === "partner-filter-all") { state.partnerFilter = { searchType:"All", query:"", partner:"", from:"", to:"" }; renderApp(); }
        if (type === "delete-partner") await deleteRecord(state.selectedId);
        if (type === "delete-plot-entity") await deleteRecord(state.selectedId);
        if (type === "download") downloadCsv();
        if (type === "logout") await logout();
      } catch (error) { showNotice(error.message, "error"); }
    });
    document.addEventListener("input", event => {
      if (event.target.matches("[data-payout-sale], [data-payout-rate], [data-payout-manual]")) updatePartnerPayout();
      if (event.target.matches("[data-transaction-gross], [data-transaction-tds]")) updatePartnerTransaction();
      if (event.target.matches("[data-search]")) { state.search = event.target.value; const module = modules.find(item => item.id === state.active); if (module) renderApp(); }
      if (event.target.matches("[data-plot-list-search]")) state.plotSearch = event.target.value;
      if (event.target.matches("[data-partner-filter]")) state.partnerFilter[event.target.dataset.partnerFilter] = event.target.value;
      if (event.target.matches("[data-plot-size]")) updatePlotArea(event.target.closest("form"));
      if (event.target.matches("[data-plot-finance-input]")) updatePlotFinancials(event.target.closest("form"));
    });
    document.addEventListener("change", event => {
      if (event.target.matches("#payoutPartner")) { const rate = event.target.selectedOptions[0]?.dataset.rate; const form = event.target.closest("form"); if (rate && !form.percentage.value) form.percentage.value = rate; updatePartnerPayout(); }
      if (event.target.matches('input[name="accessType"]')) state.loginRole = event.target.value;
      if (event.target.matches('input[name="partner"]')) {
        const form = event.target.closest("#registrationBookingForm");
        const commission = form?.querySelector("[data-registration-commission]");
        if (commission) {
          const isIndividualPartnerBooking = event.target.value === "Yes (listed partner)";
          commission.hidden = !isIndividualPartnerBooking;
          if (!isIndividualPartnerBooking) commission.querySelector("input").value = "";
        }
      }
      if (event.target.matches("[data-plot-project-control]")) refreshPlotBlockOptions(event.target.value);
      if (event.target.matches("[data-registration-project]")) {
        const form = event.target.closest("form");
        const block = form.querySelector("[data-registration-block]");
        block.innerHTML = registrationBlockNames(event.target.value).length ? registrationBlockNames(event.target.value).map((name, index) => `<option value="${esc(name)}" ${index ? "" : "selected"}>${esc(name)}</option>`).join("") : `<option value="" selected disabled>No blocks available</option>`;
        form.querySelector('[name="plotNumber"]').value = "";
        const picker = form.querySelector(".registration-plot-status");
        if (picker) picker.outerHTML = registrationPlotPicker({ project:event.target.value, block:block.value, plotNumber:"" });
      }
      if (event.target.matches("[data-registration-block]")) {
        const form = event.target.closest("form"), project = form.querySelector("[data-registration-project]").value;
        form.querySelector('[name="plotNumber"]').value = "";
        const picker = form.querySelector(".registration-plot-status");
        if (picker) picker.outerHTML = registrationPlotPicker({ project, block:event.target.value, plotNumber:"" });
      }
      if (event.target.matches("[data-partner-filter]")) state.partnerFilter[event.target.dataset.partnerFilter] = event.target.value;
      if (event.target.matches("[data-plot-size]")) updatePlotArea(event.target.closest("form"));
      if (event.target.matches("[data-plot-finance-input]")) updatePlotFinancials(event.target.closest("form"));
      if (event.target.matches("[data-plot-partner-control]")) refreshPartnerCommission(event.target);
    });
    async function boot() {
      if (state.token) return loadDashboard();
      try {
        const response = await fetch("/api/setup-status", { cache:"no-store" });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Could not check setup status.");
        state.setupRequired = Boolean(data.setupRequired);
        renderLogin();
      } catch (error) {
        renderLogin(`The local server is unavailable. ${error.message}`);
      }
    }
    boot();
  </script>
</body>
</html>
